name: Manuskript-PDF

# Bei jeder Änderung am Manuskript wird das Buch neu gesetzt. Das Ergebnis
# hängt als Artefakt am Lauf und lässt sich dort herunterladen.
#
# Wer hier je einen Schritt einbaut, der aus dem Lauf heraus committet:
# kein `[skip ci]` in die Commit-Botschaft. Zusammengeführt wird per Squash,
# und dabei wandern sämtliche Botschaften des Zweigs in die eine Nachricht
# des Hauptzweig-Commits – GitHub liest die Bremse dort weiter und
# überspringt den Satz. Genau das ist am 01.09.2026 mit dem Schriftwechsel
# geschehen (#47): Der Hauptzweig bekam keinen Lauf, keine Ausgabenummer und
# keine Veröffentlichung, obwohl der Inhalt vollständig angekommen war;
# nachgeholt wurde es von Hand über „Run workflow".
#
# Nötig war die Bremse ohnehin nie. Ein Schub, der mit dem GITHUB_TOKEN
# gemacht ist, löst nach GitHubs eigener Regel keinen neuen Lauf aus – die
# Schleife, gegen die sie stand, gibt es gar nicht.

on:
  push:
    paths:
      - 'manuskript/**'
      - 'satz/**'
      - '.github/workflows/manuskript-pdf.yml'
  pull_request:
    paths:
      - 'manuskript/**'
      - 'satz/**'
      - '.github/workflows/manuskript-pdf.yml'
  workflow_dispatch:

# Die Ausgabenummer hat zwei Teile, und nur einer wird gezählt. Die Zahl
# nach dem Punkt zählt der Schritt „Ausgabenummer bestimmen" an den
# vorhandenen Marken hoch; die Zahl davor, die Hauptnummer, steht hier und
# sonst nirgends – gesetzt statt gezählt. Wer sie erhöht, setzt damit den
# Zähler zurück, ohne eine Marke anzufassen: Die erste Ausgabe der neuen
# Reihe ist die .0, weil noch keine Marke mit dieser Hauptnummer existiert,
# und die Marken der alten Reihe bleiben samt ihren Veröffentlichungen
# stehen. Am 02.09.2026 von 1 auf 2 gehoben; die erste Reihe endete mit 1.31.
env:
  HAUPTNUMMER: '2'

permissions:
  contents: read

# Wer zweimal hintereinander schiebt, braucht nur den zweiten Satz.
concurrency:
  group: manuskript-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  satz:
    name: Buch setzen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Schreibrecht braucht allein der letzte Schritt: die Veröffentlichung.
    permissions:
      contents: write

    steps:
      - name: Quellen holen
        uses: actions/checkout@v4

      # Jeder Satz auf dem Hauptzweig bekommt eine eigene Nummer, und die
      # Nummer steht im Dateinamen wie in der Marke. Gezählt wird die Zahl
      # nach dem Punkt, an den vorhandenen Marken der laufenden Reihe selbst
      # und nicht an einer Datei im Baum: So braucht der Lauf keinen Schritt,
      # der ins Verzeichnis zurückschreibt, und eine gelöschte
      # Veröffentlichung gibt ihre Nummer nicht wieder frei, solange ihre
      # Marke steht. Welche Reihe läuft, sagt die Hauptnummer oben unter env.
      - name: Ausgabenummer bestimmen
        id: nummer
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARDZWEIG: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Die Hauptnummer wandert gleich in ein Suchmuster. Was keine Zahl
          # ist, gehört dort nicht hinein.
          case "${HAUPTNUMMER:-}" in
            ''|*[!0-9]*)
              echo "HAUPTNUMMER muss eine Zahl sein, steht aber auf '${HAUPTNUMMER:-}'." >&2
              exit 1 ;;
          esac
          marken=$(
            {
              gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                --json tagName --jq '.[].tagName' 2>/dev/null || true
              git ls-remote --tags --refs origin "v${HAUPTNUMMER}.*" 2>/dev/null \
                | sed 's#.*refs/tags/##' || true
            }
          )
          # Keine Marke zu finden ist der Regelfall des ersten Laufs jeder
          # Reihe – so beginnt der Zähler bei null, wenn die Hauptnummer
          # steigt – und darf den Schritt nicht abbrechen; die Suche wird
          # deshalb ausdrücklich aufgefangen. (Der Lauf startet die Schale
          # mit -e.)
          hoechste=$(printf '%s\n' "$marken" \
            | grep -E "^v${HAUPTNUMMER}\.[0-9]+$" \
            | cut -d. -f2 \
            | sort -n \
            | tail -1) || hoechste=""
          if [ -z "$hoechste" ]; then
            naechste=0
          else
            naechste=$((hoechste + 1))
          fi

          # Veröffentlicht – und damit gezählt – wird nur der Hauptzweig.
          # Alles andere ist ein Entwurf und trägt statt der Nummer den
          # Quellstand, damit auch diese Dateien auseinanderzuhalten sind.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
             && [ "$GITHUB_REF_NAME" = "$STANDARDZWEIG" ]; then
            kennung="${HAUPTNUMMER}.${naechste}"
            marke="v${kennung}"
            veroeffentlichen=ja
          else
            kennung="entwurf-${GITHUB_SHA:0:7}"
            marke=""
            veroeffentlichen=nein
          fi

          {
            echo "kennung=${kennung}"
            echo "marke=${marke}"
            echo "veroeffentlichen=${veroeffentlichen}"
            echo "datei=build/polyzentrische-ordnung-manuskript-${kennung}.pdf"
          } >> "$GITHUB_OUTPUT"
          echo "Diese Ausgabe: ${kennung}"

      # Brot- und Serifenlose stehen in satz/schriften/; ein Schriftpaket
      # steht deshalb nicht mehr in dieser Liste. fonts-texgyre ist mit Heros
      # weggefallen – es war allein fuer die Serifenlose da. Die Mono bleibt
      # aus dem TeX-Baum: lmmono10-regular.otf kommt aus fonts-lmodern, und
      # das zieht texlive-latex-base ohnehin als Abhaengigkeit herein.
      - name: Satzwerkzeuge einrichten
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            pandoc \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-lang-german \
            texlive-fonts-recommended \
            poppler-utils

      # Die Vorlage spricht die Schriftdateien über ihre Namen an. Stimmen
      # die nicht, bricht erst LuaTeX ab und nennt eine Zeilennummer. Dieser
      # Schritt bricht vorher ab und nennt den Grund.
      - name: Schriftdateien prüfen
        run: |
          set -uo pipefail
          echo "Schnitte in satz/schriften/:"
          ls -1 satz/schriften/ | sed 's/^/  /'
          fehlt=0
          for schnitt in Alegreya-Regular Alegreya-Italic Alegreya-Bold \
                         Alegreya-BoldItalic AlegreyaSC-Regular \
                         AlegreyaSans-Regular AlegreyaSans-Italic \
                         AlegreyaSans-Bold AlegreyaSans-BoldItalic \
                         AlegreyaSansSC-Regular; do
            if [ ! -f "satz/schriften/${schnitt}.otf" ]; then
              echo "FEHLT: satz/schriften/${schnitt}.otf"
              fehlt=1
            fi
          done
          if [ ! -f satz/schriften/OFL.txt ]; then
            echo "FEHLT: satz/schriften/OFL.txt – die Lizenz gehoert dazu."
            fehlt=1
          fi
          # Die Mono ist die einzige Schrift, die nicht im Verzeichnis liegt.
          # Sie haengt an fonts-lmodern, das kein Schritt hier verlangt,
          # sondern texlive-latex-base mitbringt – faellt diese Abhaengigkeit
          # weg, soll es hier auffallen und nicht erst in LuaTeX.
          if ! kpsewhich lmmono10-regular.otf > /dev/null 2>&1; then
            echo "FEHLT: lmmono10-regular.otf (Paket fonts-lmodern)."
            fehlt=1
          fi
          if [ "$fehlt" = "1" ]; then
            echo
            echo "Der Schriftblock in satz/vorlage.tex erwartet diese Namen"
            echo "in satz/schriften/. Fehlt dort etwas, gehoert es dorthin –"
            echo "nicht in diesen Schritt."
            exit 1
          fi
          echo "Alle erwarteten Schnitte vorhanden."

      - name: Buch setzen
        run: python3 satz/build.py --ausgabe '${{ steps.nummer.outputs.datei }}'

      - name: Ergebnis vermerken
        env:
          PDF: ${{ steps.nummer.outputs.datei }}
          KENNUNG: ${{ steps.nummer.outputs.kennung }}
        run: |
          seiten=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          groesse=$(du -h "$PDF" | cut -f1)
          {
            echo "### Manuskript gesetzt"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ausgabe | ${KENNUNG} |"
            echo "| Seiten | ${seiten} |"
            echo "| Umfang | ${groesse} |"
            echo "| Quellstand | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "Das PDF hängt als Artefakt **manuskript-pdf-${KENNUNG}** an diesem Lauf."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PDF als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: manuskript-pdf-${{ steps.nummer.outputs.kennung }}
          path: ${{ steps.nummer.outputs.datei }}
          if-no-files-found: error

      # Ein Artefakt ist nur mit Anmeldung erreichbar und verfällt. Damit das
      # Buch von außen sichtbar bleibt, bekommt jeder Satz des Hauptzweigs
      # eine eigene Veröffentlichung unter der Marke seiner Nummer. Die
      # jüngste ist zugleich die „latest"; der Dauerverweis führt also
      # weiterhin auf den letzten Stand, sagt aber jetzt, welcher es ist.
      - name: Veröffentlichung anlegen
        if: steps.nummer.outputs.veroeffentlichen == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
          PDF: ${{ steps.nummer.outputs.datei }}
          KENNUNG: ${{ steps.nummer.outputs.kennung }}
          MARKE: ${{ steps.nummer.outputs.marke }}
        run: |
          set -eu
          stand=$(sed -n 's/^\*Manuskript\. \(Stand: .*\)\.\*$/\1/p' manuskript/00_inhalt.md | head -1)
          seiten=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')

          # Derselbe Satz noch einmal unter festem Namen: Der Verweis auf
          # „latest/download/polyzentrische-ordnung-manuskript.pdf" bleibt
          # damit gültig, obwohl die eigentliche Datei ihre Nummer trägt.
          fester_name=build/polyzentrische-ordnung-manuskript.pdf
          cp "$PDF" "$fester_name"

          titel="Manuskript ${KENNUNG}"
          if [ -n "$stand" ]; then
            titel="${titel} (${stand})"
          fi
          notiz=$(printf '%s\n' \
            "Das Manuskript als Buch-PDF – Ausgabe ${KENNUNG}, ${stand:-ohne Standangabe}, ${seiten} Seiten." \
            "" \
            "Gesetzt aus \`${GITHUB_SHA:0:7}\`. Jeder Satz des Hauptzweigs bekommt eine eigene" \
            "Veröffentlichung; die Nummer zählt um eins hoch und steht im Dateinamen." \
            "" \
            "Derselbe Satz liegt zusätzlich unter dem festen Namen" \
            "\`polyzentrische-ordnung-manuskript.pdf\` bei, damit der Dauerverweis auf die" \
            "jeweils letzte Ausgabe gültig bleibt." \
            "" \
            "Geändert wird im Markdown unter \`manuskript/\`, nicht im PDF.")

          gh release create "$MARKE" "$PDF" "$fester_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$titel" \
            --notes "$notiz" \
            --latest

      # Scheitert der Satz, ist der zusammengesetzte Quelltext das, woran man
      # den Fehler sieht – deshalb wird er dann mitgegeben.
      - name: Zwischenstand bei Fehlschlag ablegen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manuskript-zwischenstand
          path: build/
          if-no-files-found: ignore
          retention-days: 7
