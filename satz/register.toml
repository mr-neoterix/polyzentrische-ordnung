# Das Register am Ende jedes Bandes.
#
# Das Register nennt Fundstellen und erklärt nichts. Jede Erklärung, die hier
# stünde, wäre eine weitere Fassung eines Begriffs neben der im Text, und zwei
# Fassungen driften. Gesetzt wird es vom Satzskript (satz/build.py), gesucht
# wird im Fließtext der Kapitel – nicht im Vorspann, nicht in den Überschriften,
# nicht im Belegapparat. Genannt wird je Kapitel die erste Nennung und dazu die
# Erklärungsstelle, diese halbfett; im E-Book steht das Kapitel statt der Seite.
# Jeder Band hat seine eigene Liste, und sie nennt nur Stellen dieses Bandes.
#
# Ein Eintrag hat bis zu fünf Angaben:
#
#   stichwort   – wie das Stichwort im Register steht. Wortgruppen aus
#                 Eigenschaftswort und Hauptwort stehen umgestellt
#                 („Budgetbeschränkung, weiche“), feste Fügungen nicht.
#   formen      – die Wortformen, nach denen im Fließtext gesucht wird, genau so,
#                 wie sie dort stehen: mit Groß- und Kleinschreibung, an
#                 Wortgrenzen, jede Beugung einzeln („Engpass“ findet nicht
#                 „Engpasses“, wohl aber „Engpass-Argument“). Fehlt die Angabe,
#                 wird nach dem Stichwort selbst gesucht.
#   erklaerung  – eine kurze wörtliche Wortfolge aus dem Satz, der den Begriff in
#                 diesem Band erklärt, ohne Sternchen und Anführungszeichen. Sie
#                 muss im Fließtext des Bandes genau einmal vorkommen. Erklärt
#                 der Band den Begriff an mehreren Stellen, etwa knapp bei einer
#                 frühen Nennung und ausführlich an seiner Heimatstelle, führt
#                 die Liste eine davon; die übrigen erscheinen als gewöhnliche
#                 Seiten. Deshalb sagt der Satz über dem Register „eine Seite“.
#   sortierung  – wahlweise ein eigener Sortierschlüssel. Sonst sortiert das
#                 Stichwort, deutsch: ä wie a, ö wie o, ü wie u, ß wie ss.
#   ausnahmen   – wahlweise Wortformen, die aussehen wie eine Beugung des
#                 Stichworts und etwas anderes meinen (siehe unten).
#
# Findet der Lauf eine Wortform oder eine Erklärungsstelle nicht, warnt er, und
# die Warnung steht in build/ausgabe.json und im Text der Veröffentlichung. Wer
# einen erklärenden Satz umschreibt, zieht hier die Wortfolge nach. Ebenso warnt
# er, wenn im Fließtext eine gebeugte Form steht, die die Liste nicht führt
# („Wettrüstens“ zu „Wettrüsten“), und ihretwegen ein Kapitel fehlt oder die
# erste Nennung zu spät steht. Meint die Form den Begriff, gehört sie unter
# formen; meint sie etwas anderes, unter ausnahmen.

